{% extends 'blog/base.html' %}

{% block content %}
<h2>Delete post</h2>
<p>Are you sure you want to delete "{{ post.title }}"?</p>
<form method="POST">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a class="btn btn-secondary" href="{% url 'post_detail' pk=post.pk %}">Cancel</a>
</form>
{% endblock %}
