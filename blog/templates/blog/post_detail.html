{% extends 'blog/base.html' %}

{% block content %}
<article class="post">
    {% if user == post.author %}
    <aside class="actions">
        <a class="btn btn-secondary" href="{% url 'post_edit' pk=post.pk %}">
            {% include './icons/pencil-fill.svg' %}
        </a>
        <a class="btn btn-danger" href="{% url 'post_delete' pk=post.pk %}">Delete</a>
    </aside>
    {% endif %}
    {% if post.published_date %}
    <time class="date">
        {{ post.published_date }}
    </time>
    {% endif %}
    <h2>{{ post.title }}</h2>
    <p>By <a href="{% url 'profile' username=post.author.username %}">{{ post.author }}</a></p>
    <p>{{ post.text|linebreaksbr }}</p>
</article>
{% endblock %}
